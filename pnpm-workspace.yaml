# pnpm Workspace — Microfrontend Architecture
# Each package is independently developed, built, and deployed.
#
# Structure:
#   apps/shell          → Main host app (Next.js App Router)
#   apps/dashboard      → Dashboard microfrontend
#   apps/marketing      → Marketing/public pages microfrontend
#   packages/ui         → Shared design system (Button, Input, etc.)
#   packages/config     → Shared ESLint, TypeScript, Tailwind configs
#   packages/utils      → Shared utilities and helpers
#   packages/types      → Shared TypeScript types
#   packages/api-client → Shared API client and hooks

packages:
  - 'apps/*'
  - 'packages/*'
